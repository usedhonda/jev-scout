name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / Node 22
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("skills/jev-scout/SKILL.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          if len(lines) < 4 or lines[0] != "---":
              raise SystemExit("SKILL.md must start with YAML frontmatter")
          try:
              end = lines.index("---", 1)
          except ValueError as exc:
              raise SystemExit("SKILL.md frontmatter is not closed") from exc
          fields = {line.split(":", 1)[0] for line in lines[1:end] if ":" in line}
          required = {"name", "description"}
          missing = required - fields
          if missing:
              raise SystemExit(f"SKILL.md frontmatter missing: {sorted(missing)}")
          if end == len(lines) - 1:
              raise SystemExit("SKILL.md has no body")
          print(f"validated {path} ({end - 1} frontmatter lines)")
          PY
